<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosmos 3D</title>
<style>

#hud{left:12px;top:calc(10px + env(safe-area-inset-top,0px));padding:8px 14px;pointer-events:none}
#st{color:var(--sun)}#rd{color:var(--mut);font-size:12px}
#bar{right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:4px;padding:5px}

#dock label{display:flex;gap:5px;align-items:center;cursor:pointer}
#nav{left:12px;top:calc(66px + env(safe-area-inset-top,0px));bottom:70px;width:min(230px,calc(100vw - 24px));overflow:auto;padding:8px;z-index:3}
#nav h3{font:600 15px Georgia,serif;color:var(--sun);margin:10px 6px 3px}#nav button{display:block;width:100%;text-align:left;border-radius:8px}
#info{right:12px;top:calc(66px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 24px));max-height:calc(100vh - 150px);overflow:auto;padding:14px}
#info h2{font:600 24px Georgia,serif;margin:0}#tp{color:var(--sun);font-size:13px}#pv{width:100%;height:110px;border-radius:10px;background:#02030a;margin:8px 0;display:block}
dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}dt{color:var(--mut)}dd{margin:0;text-align:right}
#x{position:absolute;right:6px;top:6px;padding:3px 9px}.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.acts button{border-color:var(--line)}
#disc{inset:0;border-radius:0;overflow:auto;padding:24px 20px 90px;z-index:5;background:rgba(3,4,11,.92)}
#disc .in{max-width:720px;margin:0 auto}#disc h2{font:600 28px Georgia,serif;margin:0 0 6px}
.row{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:4px 16px;padding:11px 0;border-top:1px solid var(--line)}
.row b{font:600 22px Georgia,serif;color:var(--sun)}.row i{display:block;font-style:normal;color:var(--mut);font-size:13px}
[hidden]{display:none!important}
.lb{position:fixed;left:0;top:0;font-size:11px;color:#dbe4ff;text-shadow:0 1px 5px #000;pointer-events:none;white-space:nowrap;will-change:transform}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:4}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;color:var(--mut);font-size:13px;pointer-events:none;transition:opacity .8s;text-align:center}
</style></head><body>
<div id="labels"></div>
<div id="hud" class="p"><div id="st"></div><div id="rd"></div></div>
<div id="bar" class="p"><button id="bn">Explore</button><button id="bd">Discoveries</button><button id="bs">Land on Earth</button></div>
<aside id="nav" class="p" hidden></aside>
<aside id="info" class="p" hidden><button id="x" aria-label="Close">✕</button><div id="tp"></div><h2 id="nm"></h2><canvas id="pv" width="300" height="110"></canvas><p id="ds" style="margin:6px 0;color:#cfd6ea"></p><dl id="rw"></dl><div class="acts"><button id="go">Fly here</button><button id="land" hidden>Land on surface</button></div></aside>
<section id="disc" class="p" hidden><div class="in"><button id="dx" style="float:right;border-color:var(--line)">Close</button><h2>What we have discovered</h2><div id="dl"></div><p style="color:var(--mut);font-size:12px">Real counts as of November 2026; they keep growing. Distances between objects here are compressed so you can travel; the numbers in each card are the real ones. Deep-field galaxies are generated for illustration.</p></div></section>
<div id="dock" class="p"><label><input id="cg" type="checkbox" checked>Galaxies</label><label><input id="cc" type="checkbox" checked>Constellations</label><label>Speed <input id="sp" type="range" min="0" max="4" step=".2" value="1" style="width:80px"></label></div>

<div id="fade"></div>

{const N=7000,p=new Float32Array(N*3),c=new Float32Array(N*3),pal=[[.73,.9,1],[1,1,1],[1,.94,.77],[1,.8,.6],[1,.65,.6]];
